[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bola-framework"
version = "0.1.0"
description = "Automated black-box identification and exploitation framework for Broken Object Level Authorization (BOLA) in REST and GraphQL APIs."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
bola-scan = "bola_framework.cli:main"

[tool.setuptools.packages.find]
include = ["bola_framework*"]
